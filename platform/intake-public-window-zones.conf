# Shared in-memory state for one attended WYWA public-intake experiment.
# Install only while an independent automatic rollback is already armed.

map "$request_method:$uri" $wywa_intake_window_method_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:/v1/intake/apply" 1;
    "POST:/v1/intake/withdraw" 1;
}

limit_req_zone $binary_remote_addr zone=wywa_intake_apply_per_ip:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=wywa_intake_withdraw_per_ip:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=wywa_intake_apply_conn_per_ip:1m;
limit_conn_zone $binary_remote_addr zone=wywa_intake_withdraw_conn_per_ip:1m;
