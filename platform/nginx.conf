server {
    listen 80;
    listen [::]:80;

    server_name while-you-were-away.online;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/while-you-were-away.error.log warn;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://while-you-were-away.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name while-you-were-away.online;
    root /var/www/while-you-were-away/current;
    index index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/while-you-were-away.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/while-you-were-away.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wywa_platform_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/while-you-were-away.error.log warn;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /life.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = /feed.xml {
        default_type application/atom+xml;
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location / {
        return 404;
    }
}
