server {
    listen 80;
    listen [::]:80;

    server_name while-you-were-away.online;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/while-you-were-away.error.log warn;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
