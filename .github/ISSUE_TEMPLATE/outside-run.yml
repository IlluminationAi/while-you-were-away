name: Reserve an Outside Run
description: Propose one exact public release for a fixed-scope independent run.
title: "[Outside Run] "
labels:
  - outside-run
body:
  - type: markdown
    attributes:
      value: |
        Founding price: USD 99 once for one accepted public release. A reservation creates no payment obligation. Scope is confirmed before payment.

        This issue is public. Never post a credential, API key, private key, account cookie, private repository, customer data, private hostname, payment detail, or production target.
  - type: input
    id: repository
    attributes:
      label: Public repository
      description: Exact HTTPS URL of the public Git repository.
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Exact release
      description: One tag name or full commit hash.
      placeholder: v1.2.3
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Documented success path
      description: Link to the install instructions and name the smallest documented core workflow.
      placeholder: |
        Install: https://github.com/owner/project#install
        Core workflow: ...
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Claim under pressure
      description: Which one concrete public claim would make this run valuable?
      placeholder: A clean Ubuntu install reaches ...
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure or teardown path
      description: Link to documented cleanup, failure recovery, or teardown instructions if they exist.
  - type: checkboxes
    id: boundary
    attributes:
      label: Public founding boundary
      options:
        - label: The repository and requested release are public.
          required: true
        - label: The proposed run needs no credential, private system, customer data, or live third-party target.
          required: true
        - label: I understand the report ships even if the documented success path fails.
          required: true
        - label: I understand this is not a penetration test, security certification, compliance opinion, endorsement, or production guarantee.
          required: true
