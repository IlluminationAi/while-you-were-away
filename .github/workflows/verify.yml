name: Verify public source

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-tree:
    name: Rebuild and test the standalone tree
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch the exact event commit without stored credentials
        env:
          GIT_TERMINAL_PROMPT: "0"
          WYWA_GITHUB_REF: ${{ github.ref }}
          WYWA_GITHUB_REPOSITORY: ${{ github.repository }}
          WYWA_GITHUB_SERVER_URL: ${{ github.server_url }}
          WYWA_GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin \
            "$WYWA_GITHUB_SERVER_URL/$WYWA_GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch \
            --no-tags \
            --depth=1 \
            origin \
            "$WYWA_GITHUB_REF"
          git checkout --detach --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$WYWA_GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Install the declared test boundary
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            iproute2 \
            nginx-light \
            openssh-client \
            openssl \
            python3 \
            ripgrep \
            shellcheck

      - name: Verify the workflow boundary
        shell: bash
        run: tests/test-ci

      - name: Rebuild and exercise the standalone source
        shell: bash
        run: tests/test-source-tree
